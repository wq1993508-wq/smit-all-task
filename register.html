
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>

<body>

    <header>
        <h1>Student Registration</h1>

        <nav>
            <a href="index.html">Home</a> 
            <a href="courses.html">Courses</a> 
            <a href="register.html">Register</a> 
            <a href="about.html">About</a>
        </nav>
    </header>

    <main>

        <h2>Registration Form</h2>

        <form>

            <fieldset>
                <legend>Personal Information</legend>

                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>

                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required>

            </fieldset>

            <br>

            <fieldset>
                <legend>Course Information</legend>

                <label for="course">Select Course:</label>

                <select id="course" name="course" required>
                    <option value="">Select a Course</option>
                    <option value="web-development">Web Development</option>
                    <option value="graphic-designing">Graphic Designing</option>
                    <option value="ms-office">MS Office</option>
                </select>

                <br><br>

                <p>Study Mode:</p>

                <input type="radio" id="online" name="study_mode" value="online">
                <label for="online">Online</label>

                <input type="radio" id="onsite" name="study_mode" value="onsite">
                <label for="onsite">On-site</label>

            </fieldset>

            <br>

            <fieldset>
                <legend>Previous Skills</legend>

                <input type="checkbox" id="html" name="skills" value="html">
                <label for="html">HTML</label>

                <input type="checkbox" id="computer" name="skills" value="computer">
                <label for="computer">Computer Basics</label>

                <input type="checkbox" id="design" name="skills" value="design">
                <label for="design">Designing</label>

            </fieldset>

            <br>

            <label for="comments">Comments:</label>
            <br>

            <textarea id="comments" name="comments" rows="5" cols="40"></textarea>

            <br><br>

            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions.</label>

            <br><br>

            <input type="submit" value="Register">
            <input type="reset" value="Reset">

        </form>

    </main>

    <footer>
        <p>© 2026 Student Learning Hub</p>
    </footer>

</body>

</html>
